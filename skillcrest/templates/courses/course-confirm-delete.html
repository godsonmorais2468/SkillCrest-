{% extends 'base.html' %}
{% block title %}Course Form{% endblock %}

{% block section %}
<div class="container py-5">
    <h2 class="mb-4">Course Form</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Save Course</button>
        <a href="{% url 'course-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
